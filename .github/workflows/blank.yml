# steps:
  - name: Checkout Project
    uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: 'temurin'
      java-version: '17'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Accept Android SDK Licenses
    run: yes | sdkmanager --licenses || true

  - name: Prepare Keystore and Secrets
    run: |
      touch .env
      touch local.properties
      if [ -f debug.keystore.base64 ] && [ -s debug.keystore.base64 ]; then
        base64 -d debug.keystore.base64 > debug.keystore
      else
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      fi

  - name: Ensure Gradle Wrapper Executable
    run: chmod +x gradlew

  - name: Setup Gradle Cache
    uses: gradle/actions/setup-gradle@v4

  - name: Build Debug APK
    run: ./gradlew :app:assembleDebug -x test -x lint --no-daemon --stacktrace

  - name: Verify APK Generated
    run: |
      ls -lh app/build/outputs/apk/debug/

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: GME-Attendance-App
      path: app/build/outputs/apk/debug/*.apk
